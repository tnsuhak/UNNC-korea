name: Finalize UNNC production URLs once

on:
  push:
    branches:
      - main
    paths:
      - scripts/finalize_prod_urls_once.py
      - .github/workflows/finalize-prod-urls-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize production URLs
        run: python scripts/finalize_prod_urls_once.py
      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py
      - name: Commit final production URLs and remove one-time helper
        shell: bash
        run: |
          rm -f scripts/finalize_prod_urls_once.py .github/workflows/finalize-prod-urls-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/finalize_prod_urls_once.py .github/workflows/finalize-prod-urls-once.yml
          if git diff --cached --quiet; then
            echo "No production URL changes were needed."
            exit 0
          fi
          git commit -m "Finalize UNNC production asset and detail URLs"
          git push origin main
