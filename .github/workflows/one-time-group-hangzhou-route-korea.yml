name: One-time group Hangzhou route under Korea departure
on:
  push:
    paths:
      - '.github/workflows/one-time-group-hangzhou-route-korea.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Update Ningbo FAQ and route label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('unnc-ningbo-china-life.html')
          s=p.read_text(encoding='utf-8')
          reps={
          '"name":"서울에서 닝보로 갈 때 가장 편한 방법은 무엇인가요?","acceptedAnswer":{"@type":"Answer","text":"서울에서 출발한다면 인천공항에서 항저우 샤오산공항으로 직항 입국한 뒤, 지하철 19호선으로 항저우동역으로 이동하고 닝보행 고속철을 타는 방법을 가장 추천합니다. 중국 내 이동거리가 짧고 환승 동선도 단순한 편입니다."}': '"name":"한국에서 닝보로 갈 때 추천하는 경로는 무엇인가요?","acceptedAnswer":{"@type":"Answer","text":"한국에서 닝보로 갈 때는 항저우 경유를 대표 경로로 추천합니다. 인천·김해·제주에서 항저우 샤오산공항으로 직항 입국한 뒤, 지하철 19호선으로 항저우동역으로 이동하고 닝보행 고속철을 타는 방식입니다. 중국 내 이동거리가 짧고 환승 동선도 단순한 편입니다."}',
          '"name":"항저우를 통해 닝보로 가는 방법은 어떤가요?","acceptedAnswer":{"@type":"Answer","text":"서울에서 출발한다면 가장 추천하는 경로입니다. 인천에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역으로 이동하고, 항저우동역에서 닝보행 고속철을 이용하면 됩니다. 중국 내 이동이 짧고 환승도 비교적 단순합니다."}': '"name":"항저우를 통해 닝보로 가는 방법은 어떤가요?","acceptedAnswer":{"@type":"Answer","text":"한국에서 출발할 때 활용하기 좋은 대표 경로입니다. 인천·김해·제주에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역으로 이동하고, 항저우동역에서 닝보행 고속철을 이용하면 됩니다. 중국 내 이동이 짧고 환승도 비교적 단순합니다."}',
          '<summary>서울에서 닝보로 갈 때 가장 편한 방법은?</summary><p>서울에서는 <strong>인천 → 항저우 → 닝보</strong> 동선을 가장 추천합니다. 인천공항에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역까지 이동하고, 닝보행 고속철로 갈아타는 방식입니다. 상하이 푸동 경유보다 중국 내 이동거리가 짧고 환승 동선도 단순한 편입니다.</p>': '<summary>한국에서 닝보로 갈 때 추천하는 경로는?</summary><p><strong>한국 → 항저우 → 닝보</strong> 동선을 대표 경로로 추천합니다. 인천·김해·제주에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역까지 이동하고, 닝보행 고속철로 갈아타는 방식입니다. 상하이 푸동 경유보다 중국 내 이동거리가 짧고 환승 동선도 단순한 편입니다.</p>',
          '<summary>항저우 경유는 어떤가요?</summary><p>서울에서 출발한다면 가장 추천하는 경로입니다. 인천에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역까지 이동하고, 항저우동역에서 닝보행 고속철로 갈아타면 됩니다. 중국 내 이동이 짧고 환승도 비교적 단순합니다.</p>': '<summary>항저우 경유는 어떤가요?</summary><p>한국에서 출발할 때 활용하기 좋은 대표 경로입니다. 인천·김해·제주에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역까지 이동하고, 항저우동역에서 닝보행 고속철로 갈아타면 됩니다. 중국 내 이동이 짧고 환승도 비교적 단순합니다.</p>',
          '<h3>인천 / 김해 / 제주 → 항저우 → 닝보</h3>': '<h3>한국 → 항저우 → 닝보</h3>'
          }
          missing=[]
          for a,b in reps.items():
              if a not in s: missing.append(a[:80])
              s=s.replace(a,b)
          if missing:
              raise SystemExit('Missing patterns: '+repr(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add unnc-ningbo-china-life.html
          git rm .github/workflows/one-time-group-hangzhou-route-korea.yml
          git commit -m "chore: group Hangzhou route under Korea departure"
          git push
