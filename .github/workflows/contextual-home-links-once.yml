name: UNNC contextual homepage links

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/contextual_home_links_once.py
      - .github/workflows/contextual-home-links-once.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move guide links beside relevant homepage sections
        run: python scripts/contextual_home_links_once.py
      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py
      - name: Commit contextual homepage links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage link-layout changes were needed."
            exit 0
          fi
          git commit -m "Place UNNC detail links beside relevant homepage sections"
          git push origin "HEAD:${{ github.head_ref }}"
