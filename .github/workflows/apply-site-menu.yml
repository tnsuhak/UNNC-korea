name: Apply shared site menu

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904
    paths:
      - scripts/apply_site_menu.py
      - .github/workflows/apply-site-menu.yml

permissions:
  contents: write

jobs:
  apply-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0
      - name: Apply menu changes
        run: python scripts/apply_site_menu.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No menu changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/guide.css assets/guide-nav.js unnc-*.html
          git commit -m "Add consistent UNNC site menu"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
