name: One-time standardize UNNC contact CTA

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  update-contact-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0

      - name: Replace bottom consultation CTA on all HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          panel = '''<section class="contact-panel" id="contact" style="background:#14213d;color:#fff;text-align:center;padding:52px 20px 48px"><div style="width:min(1120px,94vw);margin:0 auto"><h2 style="font-size:clamp(25px,3vw,36px);line-height:1.25;margin:0 0 10px;font-weight:900">입학 상담, 지금 시작하세요</h2><p style="margin:0;color:#cbd3df;font-size:14px">입학요건 · 비자 · 장학금 · 기숙사 — TNS 전문 컨설턴트가 무료로 안내드립니다.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:1080px;margin:28px auto 0"><a href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener" style="min-height:76px;display:flex;align-items:center;justify-content:center;background:#FEE500;color:#1a1000;padding:17px 22px;font-size:clamp(16px,2vw,20px);font-weight:800;text-decoration:none;border-radius:6px">💬 카카오톡 무료 상담</a><a href="tel:0232881733" style="min-height:76px;display:flex;align-items:center;justify-content:center;background:#fff;color:#14213d;padding:17px 22px;font-size:clamp(16px,2vw,20px);font-weight:800;text-decoration:none;border-radius:6px">☎ 02-3288-1733</a><a href="tel:01051500105" style="min-height:76px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.42);padding:17px 22px;font-size:clamp(16px,2vw,20px);font-weight:800;text-decoration:none;border-radius:6px">📱 010-5150-0105</a></div><div style="margin-top:24px"><a href="https://open.kakao.com/o/gjEoJxwf" target="_blank" rel="noopener" style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:min(420px,92vw);background:#FEE500;color:#1a1000;padding:15px 34px;font-size:17px;font-weight:800;text-decoration:none;border-radius:6px"><span>💬 중국 글로벌 대학교 오픈채팅</span><span style="font-size:13px;font-weight:400;opacity:.72">약 400여 명 참가중</span></a></div></div></section>'''

          pattern = re.compile(r'<section(?=[^>]*class="[^"]*\bcta\b[^"]*")[^>]*>.*?</section>', re.S)
          changed = []
          skipped = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(panel, text, count=1)
              if count == 0:
                  skipped.append(path.name)
                  continue
              if '중국 글로벌 대학교 오픈채팅' not in new_text or 'tel:01051500105' not in new_text or 'open.kakao.com/o/slehLvKi' not in new_text:
                  raise SystemExit(f'CTA validation failed: {path.name}')
              path.write_text(new_text, encoding='utf-8')
              changed.append(path.name)

          if not changed:
              raise SystemExit('No CTA sections were updated')

          print(f'Updated {len(changed)} CTA sections:')
          for name in changed:
              print('-', name)
          if skipped:
              print(f'Skipped {len(skipped)} pages without CTA:')
              for name in skipped:
                  print('-', name)
          PY

      - name: Commit CTA update and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-standardize-contact-cta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/one-time-standardize-contact-cta.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Match UNNC bottom consultation CTA to XJTLU style"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
