name: One-time UNNC homepage navigation cleanup

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0

      - name: Normalize homepage internal navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Preview-safe root-relative links for every UNNC detail page.
          text = re.sub(
              r'href="https://unnc-korea\.netlify\.app/(unnc-[^"]+\.html)"',
              r'href="/\1"',
              text,
          )
          text = re.sub(
              r'href="(unnc-[^"]+\.html)"',
              r'href="/\1"',
              text,
          )

          # Make the two career-related destinations clearly distinct.
          text = text.replace(
              '>전공·졸업 후 진로<span class="arr">→</span>',
              '>전공·졸업생 진학·취업 결과<span class="arr">→</span>',
          )
          text = text.replace(
              '>취업·대학원 진학 지원<span class="arr">→</span>',
              '>인턴십·취업·대학원 지원 서비스<span class="arr">→</span>',
          )

          path.write_text(text, encoding='utf-8')

          # Structural checks: every detail page must have a homepage path.
          pages = {p.name for p in Path('.').glob('unnc-*.html')}
          linked = set(re.findall(r'href="/(unnc-[^"]+\.html)"', text))
          missing = sorted(pages - linked)
          if missing:
              raise SystemExit('Homepage is missing detail-page links: ' + ', '.join(missing))

          if 'href="https://unnc-korea.netlify.app/unnc-' in text:
              raise SystemExit('Absolute production-only detail link remains in index.html')
          if 'href="unnc-' in text:
              raise SystemExit('Non-root-relative detail link remains in index.html')

          if text == original:
              print('No homepage changes were necessary.')
          else:
              print(f'Updated homepage; verified {len(pages)} detail pages are linked.')
          PY

      - name: Commit homepage cleanup and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-homepage-nav-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-homepage-nav-cleanup.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Improve UNNC homepage internal navigation"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
