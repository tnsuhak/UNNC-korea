name: One-time revert UNNC career link labels

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  revert-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0

      - name: Restore compact career link labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('>전공·졸업생 진학·취업 결과<span class="arr">→</span>', '>전공·졸업 후 진로<span class="arr">→</span>')
          text = text.replace('>인턴십·취업·대학원 지원 서비스<span class="arr">→</span>', '>취업·대학원 진학 지원<span class="arr">→</span>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-revert-career-link-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-revert-career-link-labels.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Restore compact UNNC homepage link labels"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
