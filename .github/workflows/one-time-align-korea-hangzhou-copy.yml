name: One-time align Korea Hangzhou route wording
on:
  push:
    paths:
      - '.github/workflows/one-time-align-korea-hangzhou-copy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Align route copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('unnc-ningbo-china-life.html')
          s=p.read_text(encoding='utf-8')
          reps={
          '서울에서 닝보로 갈 때는 <strong>인천공항에서 항저우 샤오산공항으로 직항 입국한 뒤 항저우동역에서 닝보행 고속철을 타는 방법</strong>을 가장 추천합니다. 중국 내 이동거리가 짧고 환승 동선이 단순합니다. 김포-홍차오 또는 인천-푸동 경유도 항공권 시간과 가격에 따라 대안이 될 수 있습니다.': '한국에서 닝보로 갈 때는 <strong>한국 → 항저우 → 닝보</strong> 경로를 대표적으로 추천합니다. 인천·김해·제주에서 항저우 직항을 이용할 수 있고, 항저우 도착 후 닝보까지 중국 내 이동거리가 짧고 환승 동선도 단순합니다. 상하이 경유는 항공권 시간과 가격, 출발 지역에 따라 대안이 될 수 있습니다.',
          'ROUTE 03 · 서울 출발 추천': 'ROUTE 03 · 한국 출발 추천',
          '서울 출발 기준으로 가장 추천하는 방법입니다. 인천-항저우 직항 후 중국 내 이동이 짧고, 부산·경남과 제주 출발에서도 활용할 수 있습니다.': '한국 출발 기준으로 대표적으로 추천하는 방법입니다. 인천·김해·제주에서 항저우 직항을 이용할 수 있고, 항저우 도착 후 중국 내 이동이 짧습니다.',
          '<strong>출발 지역별로 보면:</strong> 서울에서는 인천-항저우-닝보 동선을 가장 추천합니다. 부산·경남은 김해-항저우가 편리하고, 김포 이용이 편한 경우에는 홍차오 경유도 좋은 대안입니다. 인천·김해는 푸동 경유도 가능하며, 제주에서는 닝보 직항 또는 항저우 경유를 비교할 수 있습니다.': '<strong>출발 지역별로 보면:</strong> 한국 → 항저우 → 닝보 경로는 인천·김해·제주에서 모두 활용할 수 있어 가장 범용적인 편입니다. 김포 이용이 편한 경우에는 홍차오 경유도 좋은 대안이고, 인천·김해는 푸동 경유도 가능합니다. 제주에서는 닝보 직항과 항저우 경유를 비교할 수 있습니다.'
          }
          missing=[]
          for a,b in reps.items():
              if a not in s: missing.append(a[:100])
              s=s.replace(a,b)
          if missing:
              raise SystemExit('Missing patterns: '+repr(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add unnc-ningbo-china-life.html
          git rm .github/workflows/one-time-align-korea-hangzhou-copy.yml
          git commit -m "chore: align Korea Hangzhou route wording"
          git push
