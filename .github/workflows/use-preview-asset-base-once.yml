name: UNNC preview asset URL fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/use_preview_asset_base_once.py
      - .github/workflows/use-preview-asset-base-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use stable Deploy Preview URLs for branch-only assets
        run: python scripts/use_preview_asset_base_once.py
      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py
      - name: Commit preview URL fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No preview URL changes were needed."
            exit 0
          fi
          git commit -m "Fix UNNC preview image and detail URLs"
          git push origin "HEAD:${{ github.head_ref }}"
