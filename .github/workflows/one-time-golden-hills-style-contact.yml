name: One-time Golden Hills style UNNC contact
on:
  push:
    paths:
      - '.github/workflows/one-time-golden-hills-style-contact.yml'
permissions:
  contents: write
jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Replace bottom consultation cards on all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = '''<section class="contact-panel" id="contact" style="background:#fff;color:#14213d;text-align:center;padding:54px 20px 58px;border-top:1px solid #e4e7ec"><div style="width:min(1120px,94vw);margin:0 auto"><h2 style="font-size:clamp(25px,3vw,36px);line-height:1.25;margin:0 0 10px;font-weight:900">입학 상담, 지금 시작하세요</h2><p style="margin:0;color:#667085;font-size:14px">학력·영어 수준·희망 전공·예산에 맞춰 UNNC 지원 전략을 안내해 드립니다.</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1080px;margin:30px auto 14px"><a href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener" style="min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#FEE500;color:#17130a;padding:20px;font-size:21px;font-weight:900;text-decoration:none;border-radius:18px;box-shadow:0 8px 22px rgba(20,33,61,.06)"><span style="font-size:28px;line-height:1">💬</span><span>카톡 상담</span><span style="font-size:14px;font-weight:400;color:#6d6219">1:1 실시간 문의</span></a><a href="tel:01051500105" style="min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#eef3f8;color:#14213d;border:1px solid #cbd5e1;padding:20px;font-size:21px;font-weight:900;text-decoration:none;border-radius:18px;box-shadow:0 8px 22px rgba(20,33,61,.04)"><span style="font-size:28px;line-height:1">📞</span><span>전화 상담</span><span style="font-size:14px;font-weight:400;color:#667085">010-5150-0105</span></a></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1080px;margin:0 auto"><a href="https://cafe.naver.com/tnsuhak.cafe" target="_blank" rel="noopener" style="min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#03c75a;color:#fff;padding:18px;font-size:18px;font-weight:900;text-decoration:none;border-radius:18px;box-shadow:0 8px 22px rgba(20,33,61,.06)"><span style="font-size:27px;line-height:1">Ⓝ</span><span>네이버 유학카페</span><span style="font-size:13px;font-weight:400;color:rgba(255,255,255,.86)">해외대학·유학 정보 커뮤니티</span></a><a href="https://open.kakao.com/o/gjEoJxwf" target="_blank" rel="noopener" style="min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#FEE500;color:#17130a;padding:18px;font-size:18px;font-weight:900;text-decoration:none;border-radius:18px;box-shadow:0 8px 22px rgba(20,33,61,.06)"><span style="font-size:27px;line-height:1">💬</span><span>중국 글로벌 대학교 오픈채팅</span><span style="font-size:13px;font-weight:400;color:#6d6219">약 400여 명 참가중</span></a><a href="https://tnsuhak.com/" target="_blank" rel="noopener" style="min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#14213d;color:#fff;padding:18px;font-size:18px;font-weight:900;text-decoration:none;border-radius:18px;box-shadow:0 8px 22px rgba(20,33,61,.08)"><span style="font-size:27px;line-height:1">🏠</span><span style="color:#e8d4a0">TNS유학 홈페이지</span><span style="font-size:13px;font-weight:400;color:#cbd3df">전체 프로그램 보기</span></a></div></div></section>'''

          pat = re.compile(r'<section class="contact-panel" id="contact".*?</section>', re.S)
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              ns,n=pat.subn(replacement,s,count=1)
              if n:
                  # mobile layout: add inline media rule before </head> if not already present
                  rule='''<style>@media(max-width:700px){.contact-panel>div>div[style*="grid-template-columns:repeat(2"]{grid-template-columns:1fr!important}.contact-panel>div>div[style*="grid-template-columns:repeat(3"]{grid-template-columns:1fr!important}.contact-panel a{min-height:104px!important}}</style>'''
                  if 'grid-template-columns:repeat(3' in ns and 'min-height:104px!important' not in ns:
                      ns=ns.replace('</head>',rule+'\n</head>',1)
                  p.write_text(ns,encoding='utf-8')
                  changed.append(p.name)
          print('updated',len(changed),changed)
          if not changed:
              raise SystemExit('No contact-panel sections found')
          PY
      - name: Commit update and remove one-time workflow
        run: |
          rm .github/workflows/one-time-golden-hills-style-contact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' .github/workflows/one-time-golden-hills-style-contact.yml
          git commit -m 'Restyle UNNC consultation cards like Golden Hills'
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
