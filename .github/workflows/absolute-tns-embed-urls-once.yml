name: UNNC absolute TNS embed URLs

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/absolute_tns_embed_urls_once.py
      - .github/workflows/absolute-tns-embed-urls-once.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert homepage URLs for TNS embedding
        run: python scripts/absolute_tns_embed_urls_once.py
      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py
      - name: Commit URL migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No URL migration changes were needed."
            exit 0
          fi
          git commit -m "Make UNNC homepage assets and detail links TNS-embed safe"
          git push origin "HEAD:${{ github.head_ref }}"
