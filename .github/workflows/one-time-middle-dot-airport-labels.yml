name: One-time middle-dot airport labels

on:
  push:
    paths:
      - '.github/workflows/one-time-middle-dot-airport-labels.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0
      - name: Replace slash separators with middle dots
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unnc-ningbo-china-life.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '인천(ICN) / 김해(PUS) / 제주(CJU)': '인천(ICN) · 김해(PUS) · 제주(CJU)',
              '인천(ICN) / 김해(PUS)': '인천(ICN) · 김해(PUS)',
              '인천 / 김해 / 제주': '인천 · 김해 · 제주',
              '인천 / 김해': '인천 · 김해',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove one-time workflow
        run: |
          rm .github/workflows/one-time-middle-dot-airport-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unnc-ningbo-china-life.html .github/workflows/one-time-middle-dot-airport-labels.yml
          git commit -m "chore: use middle dots for grouped airport labels"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
