name: UNNC one-time guide expansion

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/expand_guides_once.py
      - .github/workflows/expand-guides-once.yml

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build detailed UNNC guide architecture
        run: python scripts/expand_guides_once.py
      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py
      - name: Commit guide expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml scripts/authoritative_tone.py unnc-*.html
          if git diff --cached --quiet; then
            echo "No guide expansion changes were needed."
            exit 0
          fi
          git commit -m "Expand UNNC topic guides and homepage related links"
          git push origin "HEAD:${{ github.head_ref }}"
