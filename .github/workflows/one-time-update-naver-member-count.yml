name: One-time update Naver cafe member count

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904
    paths:
      - '.github/workflows/one-time-update-naver-member-count.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Update Naver cafe supporting text on all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '해외대학·유학 정보 커뮤니티'
          new = '회원 44,000명'
          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('No matching HTML text found')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit update and remove one-time workflow
        run: |
          rm .github/workflows/one-time-update-naver-member-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Naver cafe member count copy'
          git push
