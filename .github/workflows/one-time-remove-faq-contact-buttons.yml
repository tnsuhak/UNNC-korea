name: One-time remove FAQ contact buttons

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0

      - name: Remove contact buttons from FAQ heading only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<p class="sec-sub">입학조건·영어성적·비용·지원시기 등 자주 묻는 내용을 확인하고, 개별 지원 가능성은 카카오톡 또는 전화로 상담하세요.</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px"><a href="http://pf.kakao.com/_xfXsxjE" target="_blank" rel="noopener" class="btn-gold" style="display:inline-flex;align-items:center;justify-content:center">카카오톡 상담 →</a><a href="tel:0232881733" style="display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--navy);color:var(--navy);padding:15px 30px;border-radius:2px;font-weight:700">전화상담 02-3288-1733</a></div>'''
          new='''<p class="sec-sub">입학조건·영어성적·비용·지원시기 등 자주 묻는 내용을 확인하세요.</p>'''
          if old not in s:
              raise SystemExit('FAQ contact button block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-remove-faq-contact-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-remove-faq-contact-buttons.yml
          git commit -m "Remove duplicate consultation buttons from FAQ section"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
