name: UNNC preview enrichment

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - unnc-*.html
      - scripts/enrich_detail_pages_v2.py
      - scripts/authoritative_tone.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build XJTLU-style UNNC detail pages and refresh costs
        run: python scripts/enrich_detail_pages_v2.py

      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py

      - name: Commit preview enrichment
        shell: bash
        run: |
          git add index.html assets/guide.css unnc-*.html
          if git diff --cached --quiet; then
            echo "No enrichment changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enrich UNNC detail guides and refresh KRW costs"
          git push origin "HEAD:${{ github.head_ref }}"
