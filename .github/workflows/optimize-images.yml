name: Externalize embedded images

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - scripts/optimize_embedded_images.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract embedded images without changing quality
        run: python scripts/optimize_embedded_images.py

      - name: Commit lightweight original homepage
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/embedded; then
            echo "No embedded-image extraction changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/embedded
          git commit -m "Externalize homepage images without changing design"
          git push origin "HEAD:${{ github.head_ref }}"
