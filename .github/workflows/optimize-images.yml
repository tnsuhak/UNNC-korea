name: Optimize embedded images

on:
  push:
    branches:
      - work/unnc-korea-image-optimize-2026-09-01
    paths:
      - index.html
      - scripts/optimize_embedded_images.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Optimize only embedded images
        run: python scripts/optimize_embedded_images.py

      - name: Commit optimized original homepage
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No image optimization changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize embedded homepage images without changing design"
          git push origin "HEAD:${GITHUB_REF_NAME}"
