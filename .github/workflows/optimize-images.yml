name: UNNC preview dated FX polish

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - unnc-*.html
      - scripts/authoritative_tone.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dated wording
        run: python scripts/authoritative_tone.py --fix
      - name: Validate tone
        run: python scripts/authoritative_tone.py
      - name: Commit dated wording
        shell: bash
        run: |
          git add index.html unnc-*.html
          if git diff --cached --quiet; then
            echo "No dated wording changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use dated FX wording in UNNC guides"
          git push origin "HEAD:${{ github.head_ref }}"
