name: UNNC preview maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - scripts/optimize_embedded_images.py
      - scripts/upgrade_site.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep existing homepage images externalized
        run: python scripts/optimize_embedded_images.py

      - name: Apply verified content and SEO upgrade
        run: python scripts/upgrade_site.py

      - name: Commit preview site changes
        shell: bash
        run: |
          git add index.html assets/embedded assets/guide.css \
            unnc-admission-requirements-korea-2027.html \
            unnc-tuition-scholarships-2027.html \
            unnc-programmes-careers.html \
            unnc-nottingham-degree-uk-campus.html \
            robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated site changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade UNNC content, SEO, and internal guides"
          git push origin "HEAD:${{ github.head_ref }}"
