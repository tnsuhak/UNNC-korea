name: UNNC preview tone refinement

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - unnc-*.html
      - scripts/authoritative_tone.py
      - scripts/tone_refine_once.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refine visible Korean copy
        run: python scripts/tone_refine_once.py

      - name: Validate authoritative Korean tone
        run: python scripts/authoritative_tone.py

      - name: Commit refined copy
        shell: bash
        run: |
          git add index.html unnc-*.html
          if git diff --cached --quiet; then
            echo "No tone refinements were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine UNNC Korean copy to institutional tone"
          git push origin "HEAD:${{ github.head_ref }}"
