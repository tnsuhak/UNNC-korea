name: UNNC preview maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - unnc-*.html
      - scripts/optimize_embedded_images.py
      - scripts/authoritative_tone.py
      - scripts/tone_quickfix.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep existing homepage images externalized
        run: python scripts/optimize_embedded_images.py

      - name: Rewrite source-attribution wording as direct facts
        run: python scripts/tone_quickfix.py

      - name: Apply and validate authoritative Korean tone
        run: python scripts/authoritative_tone.py --fix

      - name: Commit preview tone cleanup
        shell: bash
        run: |
          git add index.html unnc-*.html assets/embedded
          if git diff --cached --quiet; then
            echo "No tone cleanup changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use direct authoritative Korean copy"
          git push origin "HEAD:${{ github.head_ref }}"
