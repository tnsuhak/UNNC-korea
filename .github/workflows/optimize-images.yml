name: UNNC preview quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - unnc-*.html
      - masters/**
      - data/unnc-masters-2027.json
      - data/unnc-mres-2027.json
      - sitemap.xml
      - robots.txt
      - favicon.svg
      - scripts/optimize_embedded_images.py
      - scripts/authoritative_tone.py
      - scripts/validate_masters_site.py
      - scripts/validate_unnc_masters_data.py
      - scripts/validate_unnc_mres_data.py
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check lxml

      - name: Keep embedded images externalized
        run: python scripts/optimize_embedded_images.py

      - name: Check authoritative Korean tone
        run: python scripts/authoritative_tone.py

      - name: Validate complete masters section
        run: python scripts/validate_masters_site.py

      - name: Commit image extraction only when needed
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/embedded; then
            echo "No embedded-image extraction changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/embedded
          git commit -m "Externalize homepage images without changing design"
          git push origin "HEAD:${{ github.head_ref }}"
