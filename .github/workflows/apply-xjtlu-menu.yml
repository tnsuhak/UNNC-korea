name: Apply XJTLU-style UNNC menu

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904
    paths:
      - scripts/apply_xjtlu_menu.py
      - .github/workflows/apply-xjtlu-menu.yml

permissions:
  contents: write

jobs:
  apply-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0
      - name: Apply shared menu loader
        run: python scripts/apply_xjtlu_menu.py
      - name: Commit generated change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load XJTLU-style mega menu on UNNC homepage"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
