name: One-time mobile reveal fix

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0
      - name: Make reveal content always visible on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle="  .rv{opacity:0;transform:translateY(28px);transition:.7s cubic-bezier(.16,.84,.44,1)}.rv.in{opacity:1;transform:none}\n"
          replacement=needle+"  @media(max-width:960px){.rv{opacity:1!important;transform:none!important}}\n"
          if '@media(max-width:960px){.rv{opacity:1!important;transform:none!important}}' not in s:
              if needle not in s:
                  raise SystemExit('Reveal CSS marker not found')
              s=s.replace(needle,replacement,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-mobile-rv-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-mobile-rv-fix.yml
          git commit -m "Fix hidden reveal sections on mobile"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
