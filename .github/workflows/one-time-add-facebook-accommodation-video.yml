name: One-time add accommodation Facebook video

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  add-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0

      - name: Add Facebook accommodation video
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('unnc-accommodation-campus-life.html')
          text = path.read_text(encoding='utf-8')
          marker = '<section class="section"><h2>생활 지원과 안전</h2>'
          if '19G1YXySfH' not in text:
              section = '''<section class="section"><h2>기숙사 영상으로 보기</h2><p class="lead">사진과 함께 기숙사 내부와 생활 공간을 Facebook 영상으로도 확인해 보세요.</p><div style="max-width:900px;margin:0 auto;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 18px 40px rgba(20,33,61,.16)"><div style="position:relative;width:100%;aspect-ratio:16/9;background:#000"><iframe title="UNNC 기숙사 Facebook 영상" src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Fshare%2Fv%2F19G1YXySfH%2F&amp;show_text=false&amp;width=900" style="position:absolute;inset:0;width:100%;height:100%;border:0;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" loading="lazy"></iframe></div></div><p style="margin-top:14px;text-align:center;font-size:.86rem;color:#667085">영상이 페이지 안에서 재생되지 않으면 <a href="https://www.facebook.com/share/v/19G1YXySfH/" target="_blank" rel="noopener" style="color:#8b6a1f;font-weight:700">Facebook에서 원본 영상 보기 →</a></p></section>\n'''
              if marker not in text:
                  raise SystemExit('Insertion marker not found')
              text = text.replace(marker, section + marker, 1)
              path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          if 'facebook.com/plugins/video.php' not in updated or '19G1YXySfH' not in updated:
              raise SystemExit('Facebook video embed was not added')
          print('Facebook accommodation video section added.')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-add-facebook-accommodation-video.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unnc-accommodation-campus-life.html .github/workflows/one-time-add-facebook-accommodation-video.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Facebook accommodation video"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
