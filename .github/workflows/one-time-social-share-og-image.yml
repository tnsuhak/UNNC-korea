name: One-time UNNC social share image

on:
  push:
    branches:
      - feature/social-share-og-image-20260909
    paths:
      - .github/workflows/one-time-social-share-og-image.yml

permissions:
  contents: write

jobs:
  update-social-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-share-og-image-20260909
          fetch-depth: 0

      - name: Create social image and update metadata
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('assets/embedded/6702ac55ed7d1baf.webp')
          out_dir = Path('assets/social')
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / 'unnc-korea-share-20260909.jpg'

          img = Image.open(src).convert('RGB')
          fitted = ImageOps.fit(img, (1200, 630), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          fitted.save(out, 'JPEG', quality=90, optimize=True, progressive=True)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<meta property="og:locale" content="ko_KR">\n<meta name="twitter:card" content="summary">'
          new = '\n'.join([
              '<meta property="og:locale" content="ko_KR">',
              '<meta property="og:image" content="https://unnc-korea.netlify.app/assets/social/unnc-korea-share-20260909.jpg">',
              '<meta property="og:image:secure_url" content="https://unnc-korea.netlify.app/assets/social/unnc-korea-share-20260909.jpg">',
              '<meta property="og:image:type" content="image/jpeg">',
              '<meta property="og:image:width" content="1200">',
              '<meta property="og:image:height" content="630">',
              '<meta property="og:image:alt" content="University of Nottingham Ningbo China 캠퍼스 전경">',
              '<meta name="twitter:card" content="summary_large_image">',
              '<meta name="twitter:image" content="https://unnc-korea.netlify.app/assets/social/unnc-korea-share-20260909.jpg">',
              '<meta name="twitter:image:alt" content="University of Nottingham Ningbo China 캠퍼스 전경">',
          ])
          if old not in s:
              raise SystemExit('Expected OG/Twitter metadata block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          assert s.count('property="og:image"') == 1
          assert 'summary_large_image' in s
          assert out.exists() and out.stat().st_size > 10000
          PY

      - name: Commit update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-social-share-og-image.yml
          git add index.html assets/social/unnc-korea-share-20260909.jpg
          git commit -m "Set UNNC social share campus image"
          git push origin HEAD:feature/social-share-og-image-20260909
