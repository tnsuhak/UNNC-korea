name: One-time standardize UNNC office footer

on:
  push:
    branches:
      - feature/unnc-clubs-student-life-20260904

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
          fetch-depth: 0

      - name: Add Seoul and Busan offices to all HTML footers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = sorted(Path('.').glob('*.html'))

          office_inner = '''<div style="margin-bottom:14px">㈜티앤에스월드와이드 · 대표 신윤옥 · 사업자등록번호 220-87-54964</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 30px"><div><strong style="display:block;color:#fff;margin-bottom:5px">서울 본사</strong>서울시 강남구 테헤란로 5길 7 KG타워 B1 (우 06134)<br><a href="tel:0232881733" style="color:inherit;text-decoration:none">02-3288-1733</a><br><a href="mailto:tns@tnsuhak.com" style="color:inherit;text-decoration:none">tns@tnsuhak.com</a></div><div><strong style="display:block;color:#fff;margin-bottom:5px">부산 지사</strong>부산광역시 부산진구 중앙대로 694 쥬디스태화 9층 37호 (우 47295)<br><a href="tel:01050241733" style="color:inherit;text-decoration:none">010-5024-1733</a></div></div>'''
          simple_new = '<footer><div class="wrap">' + office_inner + '</div></footer>'
          reviews_new = '<footer>' + office_inner + '</footer>'

          simple_pattern = re.compile(
              r'<footer><div class="wrap">㈜티앤에스월드와이드.*?서울 강남구 테헤란로 5길 7 KG타워 B1.*?tns@tnsuhak\.com</div></footer>',
              re.S,
          )
          reviews_pattern = re.compile(
              r'<footer>㈜티앤에스월드와이드.*?서울 강남구 테헤란로 5길 7 KG타워 B1.*?tns@tnsuhak\.com</footer>',
              re.S,
          )

          main_old = '<div class="foot-info"><span class="co">㈜티앤에스월드와이드</span> · 대표: 신윤옥 · 사업자등록번호: 220-87-54964<br>서울 강남구 테헤란로 5길 7 KG타워 B1 · Tel. 02-3288-1733 · tns@tnsuhak.com<div class="copy">© 2025 TNS Worldwide Co., Ltd. All Rights Reserved.</div></div>'
          main_new = '''<div class="foot-info"><span class="co">㈜티앤에스월드와이드</span> · 대표: 신윤옥 · 사업자등록번호: 220-87-54964<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 30px;margin-top:12px"><div><strong style="display:block;color:#cdd7e6;margin-bottom:4px">서울 본사</strong>서울시 강남구 테헤란로 5길 7 KG타워 B1 (우 06134)<br><a href="tel:0232881733" style="color:inherit">Tel. 02-3288-1733</a><br><a href="mailto:tns@tnsuhak.com" style="color:inherit">tns@tnsuhak.com</a></div><div><strong style="display:block;color:#cdd7e6;margin-bottom:4px">부산 지사</strong>부산광역시 부산진구 중앙대로 694 쥬디스태화 9층 37호 (우 47295)<br><a href="tel:01050241733" style="color:inherit">Tel. 010-5024-1733</a></div></div><div class="copy">© 2025 TNS Worldwide Co., Ltd. All Rights Reserved.</div></div>'''

          changed = []
          for path in pages:
              text = path.read_text(encoding='utf-8')
              original = text
              if path.name == 'index.html':
                  if main_old not in text:
                      raise SystemExit('Main footer pattern not found in index.html')
                  text = text.replace(main_old, main_new, 1)
              elif path.name == 'unnc-korean-student-reviews.html':
                  text, n = reviews_pattern.subn(reviews_new, text, count=1)
                  if n != 1:
                      raise SystemExit(f'Reviews footer pattern failed: {n}')
              else:
                  text, n = simple_pattern.subn(simple_new, text, count=1)
                  if n != 1:
                      raise SystemExit(f'Footer pattern not found or ambiguous in {path.name}: {n}')
              if '서울 본사' not in text or '부산 지사' not in text or 'tel:01050241733' not in text:
                  raise SystemExit(f'Footer validation failed: {path.name}')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          if len(changed) != len(pages):
              raise SystemExit(f'Expected {len(pages)} changed HTML pages, got {len(changed)}')
          print(f'Updated {len(changed)} HTML footers')
          PY

      - name: Commit footer update and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-standardize-office-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/one-time-standardize-office-footer.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Seoul and Busan office contacts to UNNC footers"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
