name: One-time prioritize Hangzhou route in Ningbo FAQ
on:
  push:
    branches: [feature/unnc-clubs-student-life-20260904]
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Update Ningbo route recommendations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unnc-ningbo-china-life.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '"name":"서울에서 닝보로 갈 때 가장 편한 상하이 경유 방법은 무엇인가요?","acceptedAnswer":{"@type":"Answer","text":"서울권에서는 김포공항에서 상하이 홍차오공항으로 직항 입국한 뒤, 공항과 연결된 홍차오역에서 닝보행 고속철을 타는 동선이 가장 단순합니다. 현재 김포-홍차오 직항은 여러 항공사가 매일 운항합니다."}':
            '"name":"서울에서 닝보로 갈 때 가장 편한 방법은 무엇인가요?","acceptedAnswer":{"@type":"Answer","text":"서울에서 출발한다면 인천공항에서 항저우 샤오산공항으로 직항 입국한 뒤, 지하철 19호선으로 항저우동역으로 이동하고 닝보행 고속철을 타는 방법을 가장 추천합니다. 중국 내 이동거리가 짧고 환승 동선도 단순한 편입니다."}',
            '서울권에서는 <strong>김포공항에서 상하이 홍차오공항으로 바로 들어간 뒤 홍차오역에서 닝보행 고속철을 타는 방법</strong>이 가장 단순합니다. 인천공항을 이용해야 한다면 상하이 푸동이나 항저우를 거치는 방법을 비교할 수 있습니다.':
            '서울에서 닝보로 갈 때는 <strong>인천공항에서 항저우 샤오산공항으로 직항 입국한 뒤 항저우동역에서 닝보행 고속철을 타는 방법</strong>을 가장 추천합니다. 중국 내 이동거리가 짧고 환승 동선이 단순합니다. 김포-홍차오 또는 인천-푸동 경유도 항공권 시간과 가격에 따라 대안이 될 수 있습니다.',
            'ROUTE 01 · 서울권 추천': 'ROUTE 01 · 상하이 경유',
            '서울권 학생에게 가장 추천하는 상하이 경유 방법. 푸동공항에서 홍차오로 다시 이동할 필요가 없습니다.':
            '김포공항 이용이 편하거나 상하이 체류를 함께 고려할 때 좋은 방법입니다. 푸동공항에서 홍차오로 다시 이동할 필요가 없습니다.',
            'ROUTE 03 · 짧은 중국 내 이동': 'ROUTE 03 · 서울 출발 추천',
            '수도권뿐 아니라 부산·경남과 제주 출발에서도 활용할 수 있고, 상하이 푸동 경유보다 중국 내 이동 동선이 짧아 편리한 선택입니다.':
            '서울 출발 기준으로 가장 추천하는 방법입니다. 인천-항저우 직항 후 중국 내 이동이 짧고, 부산·경남과 제주 출발에서도 활용할 수 있습니다.',
            '<strong>출발 지역별로 보면:</strong> 서울권은 김포-홍차오가 가장 단순하고, 부산·경남은 김해-항저우가 편리합니다. 인천·김해는 푸동 경유도 가능하며, 제주에서는 닝보 직항 또는 항저우 경유를 비교할 수 있습니다.':
            '<strong>출발 지역별로 보면:</strong> 서울에서는 인천-항저우-닝보 동선을 가장 추천합니다. 부산·경남은 김해-항저우가 편리하고, 김포 이용이 편한 경우에는 홍차오 경유도 좋은 대안입니다. 인천·김해는 푸동 경유도 가능하며, 제주에서는 닝보 직항 또는 항저우 경유를 비교할 수 있습니다.',
            '<summary>서울에서 닝보로 갈 때 가장 편한 방법은?</summary><p>김포공항에서 상하이 홍차오공항으로 직항 입국한 뒤, 홍차오역에서 닝보행 고속철을 타는 동선이 가장 단순합니다. 현재 김포-홍차오 직항은 여러 항공사가 매일 운항합니다.</p>':
            '<summary>서울에서 닝보로 갈 때 가장 편한 방법은?</summary><p>서울에서는 <strong>인천 → 항저우 → 닝보</strong> 동선을 가장 추천합니다. 인천공항에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역까지 이동하고, 닝보행 고속철로 갈아타는 방식입니다. 상하이 푸동 경유보다 중국 내 이동거리가 짧고 환승 동선도 단순한 편입니다.</p>',
            '<summary>항저우 경유는 어떤가요?</summary><p>실용적인 방법입니다. 항저우 샤오산공항에서 지하철 19호선을 이용하면 항저우동역까지 약 20여 분이고, 항저우동역에서 닝보행 고속철로 갈아탈 수 있습니다.</p>':
            '<summary>항저우 경유는 어떤가요?</summary><p>서울에서 출발한다면 가장 추천하는 경로입니다. 인천에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역까지 이동하고, 항저우동역에서 닝보행 고속철로 갈아타면 됩니다. 중국 내 이동이 짧고 환승도 비교적 단순합니다.</p>',
            '"name":"항저우를 통해 닝보로 가는 방법은 어떤가요?","acceptedAnswer":{"@type":"Answer","text":"인천에서 항저우 샤오산공항으로 입국한 뒤 지하철 19호선으로 항저우동역으로 이동하고, 항저우동역에서 닝보행 고속철을 이용하는 방법이 편리합니다."}':
            '"name":"항저우를 통해 닝보로 가는 방법은 어떤가요?","acceptedAnswer":{"@type":"Answer","text":"서울에서 출발한다면 가장 추천하는 경로입니다. 인천에서 항저우 샤오산공항으로 직항 입국한 뒤 지하철 19호선으로 항저우동역으로 이동하고, 항저우동역에서 닝보행 고속철을 이용하면 됩니다. 중국 내 이동이 짧고 환승도 비교적 단순합니다."}'
          }
          missing=[]
          for old,new in replacements.items():
              if old not in s:
                  missing.append(old[:100])
              else:
                  s=s.replace(old,new)
          if missing:
              raise SystemExit('Missing expected text: ' + repr(missing))
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page update and remove one-time workflow
        run: |
          rm .github/workflows/one-time-prioritize-hangzhou-faq.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unnc-ningbo-china-life.html .github/workflows/one-time-prioritize-hangzhou-faq.yml
          git commit -m 'Update Ningbo FAQ to recommend Hangzhou route from Seoul'
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
