name: One-time add Korean departure airport options
on:
  push:
    branches: [feature/unnc-clubs-student-life-20260904]
jobs:
  update:
    if: contains(github.event.head_commit.message, 'show Korean departure airport options')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Update Ningbo route labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('unnc-ningbo-china-life.html')
          s=p.read_text()
          replacements={
          '<h3>인천 → 상하이 푸동 → 홍차오 → 닝보</h3>':'<h3>인천 / 김해 → 상하이 푸동 → 홍차오 → 닝보</h3>',
          '<p><strong>인천(ICN) → 상하이 푸동(PVG) → 상하이 홍차오역 → 닝보역</strong></p>':'<p><strong>인천(ICN) / 김해(PUS) → 상하이 푸동(PVG) → 상하이 홍차오역 → 닝보역</strong></p>',
          '인천-상하이는 푸동공항행 항공편 선택지가 많습니다. 현재 인천-홍차오 직항은 없으므로 인천에서 출발하면 푸동공항에 도착한 뒤 공항연락선으로 홍차오 쪽으로 이동해 닝보행 고속철을 타는 방식입니다.':'인천과 김해 모두 상하이 푸동공항 직항을 이용할 수 있습니다. 인천-홍차오 직항은 현재 없으므로 인천 출발은 푸동공항 도착 후 홍차오 쪽으로 이동해야 하며, 김해 출발도 푸동 직항을 이용한 뒤 같은 방식으로 닝보행 고속철을 연결할 수 있습니다.',
          '<h3>인천 → 항저우 → 닝보</h3>':'<h3>인천 / 김해 / 제주 → 항저우 → 닝보</h3>',
          '<p><strong>인천(ICN) → 항저우 샤오산(HGH) → 항저우동역 → 닝보역</strong></p>':'<p><strong>인천(ICN) / 김해(PUS) / 제주(CJU) → 항저우 샤오산(HGH) → 항저우동역 → 닝보역</strong></p>',
          '인천에서 항저우로 입국한 뒤 샤오산공항에서 지하철 19호선을 타면 항저우동역까지 약 20여 분입니다. 항저우동역에서는 닝보행 고속철이 자주 운행되며 구간 자체는 대략 1시간 안팎입니다.':'인천뿐 아니라 김해·제주에서도 항저우 직항을 이용할 수 있습니다. 샤오산공항 도착 후 지하철 19호선으로 항저우동역까지 이동하고, 항저우동역에서 닝보행 고속철로 갈아타면 됩니다. 항저우동역-닝보 구간은 대략 1시간 안팎입니다.',
          '<div class="route-note">인천공항 출발이 편하거나 푸동행 항공권 조건이 좋을 때 유용합니다. 다만 김포-홍차오 직항보다 중국 내 환승이 한 번 더 필요합니다.</div>':'<div class="route-note">인천·부산/경남 출발에서 푸동행 항공권 조건이 좋을 때 유용합니다. 다만 김포-홍차오 직항보다 중국 내 환승이 한 번 더 필요합니다.</div>',
          '<div class="route-note">상하이 푸동 경유보다 중국 내 이동 동선이 짧아 항공편 시간과 가격이 맞으면 편리한 선택입니다.</div>':'<div class="route-note">수도권뿐 아니라 부산·경남과 제주 출발에서도 활용할 수 있고, 상하이 푸동 경유보다 중국 내 이동 동선이 짧아 편리한 선택입니다.</div>',
          '<div class="notice" style="margin-top:18px"><strong>서울권 학생에게 추천:</strong> 김포-홍차오 직항 시간이 맞으면 가장 편합니다. 홍차오공항 도착 후 같은 홍차오 교통 허브의 기차역에서 닝보행 고속철로 바로 이어갈 수 있기 때문입니다. 인천공항을 이용해야 한다면 항저우 경유와 푸동 경유를 항공권 시간·가격에 따라 비교하면 됩니다.</div>':'<div class="notice" style="margin-top:18px"><strong>출발 지역별로 보면:</strong> 서울권은 김포-홍차오가 가장 단순하고, 부산·경남은 김해-항저우가 편리합니다. 인천·김해는 푸동 경유도 가능하며, 제주에서는 닝보 직항 또는 항저우 경유를 비교할 수 있습니다.</div>'
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit(f'missing text: {a[:80]}')
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/one-time-add-korea-departure-airports.yml
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add unnc-ningbo-china-life.html .github/workflows/one-time-add-korea-departure-airports.yml
          git commit -m "Update Ningbo routes with Korean departure airports"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
