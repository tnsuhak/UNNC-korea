name: One-time compact UNNC contact cards a little more

on:
  push:
    paths:
      - '.github/workflows/one-time-compact-contact-cards-more.yml'

permissions:
  contents: write

jobs:
  compact-contact-more:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unnc-clubs-student-life-20260904
      - name: Reduce contact card sizes slightly more on all HTML pages
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'padding:44px 20px 48px': 'padding:38px 20px 42px',
              'font-size:clamp(23px,2.6vw,32px)': 'font-size:clamp(22px,2.4vw,30px)',
              'font-size:12px">학력·영어 수준·희망 전공·예산에 맞춰 UNNC 지원 전략을 안내해 드립니다.': 'font-size:11px">학력·영어 수준·희망 전공·예산에 맞춰 UNNC 지원 전략을 안내해 드립니다.',
              'gap:10px;max-width:1080px;margin:24px auto 10px': 'gap:8px;max-width:1080px;margin:20px auto 8px',
              'min-height:96px': 'min-height:88px',
              'padding:14px 16px;font-size:16px': 'padding:12px 14px;font-size:15px',
              'border-radius:12px': 'border-radius:10px',
              'font-size:23px;line-height:1': 'font-size:21px;line-height:1',
              'font-size:12px;font-weight:400;color:#6d6219': 'font-size:11px;font-weight:400;color:#6d6219',
              'font-size:12px;font-weight:400;color:#667085': 'font-size:11px;font-weight:400;color:#667085',
              'display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px': 'display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px',
              'min-height:90px': 'min-height:84px',
              'padding:13px 14px;font-size:16px': 'padding:11px 12px;font-size:15px',
              'font-size:22px;line-height:1': 'font-size:20px;line-height:1',
              'font-size:12px;font-weight:400;color:rgba(255,255,255,.86)': 'font-size:11px;font-weight:400;color:rgba(255,255,255,.86)',
              'font-size:12px;font-weight:400;color:#cbd3df': 'font-size:11px;font-weight:400;color:#cbd3df',
          }

          changed = 0
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'class="contact-panel"' not in text:
                  continue
              new = text
              for old, rep in replacements.items():
                  new = new.replace(old, rep)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'updated {changed} html files')
      - name: Commit update and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-compact-contact-cards-more.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Slightly reduce contact card and text sizes"
          git push origin HEAD:feature/unnc-clubs-student-life-20260904
